[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-spotify-recap"
version = "0.1.0"
description = "Generate a weekly Spotify listening recap from Last.fm scrobbles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
weekly-spotify-recap = "weekly_spotify_recap.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
